# agent-kit settings for this repo.
#
# The kit's scripts, hooks and skills read this file. It belongs to the repo:
# an upgrade never overwrites it. Each line is KEY="value"; a list is words
# with spaces between them. Lines that start with # are notes.
#
# Part 1 holds the answers the setup asks you for. Part 2 holds fine-tuning;
# the defaults suit most repos.

# ============================================================================
# Part 1: the basics (the setup asks you these)
# ============================================================================

# What goes to GitHub (or any remote). "Agent files" are the maps, the kit's
# docs and settings; "learning docs" are the lessons for people.
#   agent     agent files go to GitHub, learning docs stay on this computer
#   all       both go to GitHub
#   learning  learning docs go to GitHub, agent files stay on this computer
#   none      nothing goes to GitHub; everything stays on this computer
# Change it later with: sh <agent_dev_kit>/install.sh --share <mode> .
SHARE="agent"

# Folders that are one separate part each: a service, an app, a package.
# Example: "web api" makes web/ and api/ parts. Empty: no folder is a part.
UNITS=""

# Folders that hold many parts, one per subfolder.
# Example: "services packages" makes services/api, services/billing and every
# other subfolder a part. Empty: none.
UNIT_PARENTS=""

# The one-line files that point an agent to AGENTS.md. CLAUDE.md is for
# Claude Code; add GEMINI.md for Gemini CLI and Antigravity.
POINTER_FILES="CLAUDE.md"

# The end of the name of every Markdown file the kit writes, so you can see
# at a glance what came from the kit: README.agentk.md, DECISIONS.agentk.md.
# The kit never edits Markdown files without it (your README.md stays yours).
# AGENTS.md, CLAUDE.md, GEMINI.md and SKILL.md keep their exact names: agents
# load them only by those names.
# Empty: the plain names of kit 0.5 and older (README.md, DECISIONS.md).
DOC_SUFFIX=".agentk.md"

# ============================================================================
# Part 2: fine-tuning (the defaults are fine)
# ============================================================================

# --- When a part gets its own guide ---------------------------------------
# A part gets its own short map (AGENTS.md) and detail doc (README.agentk.md)
# only when it is big: this many code files, or this many lines of code.
# A smaller part needs only one line in a map above it.
# Empty both: every part gets its own map, however small.
MAP_MIN_FILES="15"
MAP_MIN_LINES="1500"

# Parts that always get their own map, or never do, whatever their size.
# Example: MAP_REQUIRED="services/auth" MAP_EXEMPT="services/legacy"
MAP_REQUIRED=""
MAP_EXEMPT=""

# The most lines a map may have: the root map and maps in first-level
# folders, then maps deeper down. A longer map fails the check; move detail
# into the detail doc it points to.
TOP_MAP_MAX=70
UNIT_MAP_MAX=40

# --- What counts as code -----------------------------------------------------
# File endings (without the dot) that count as code: for the part sizes,
# the catch-up queue and the docs reminder.
CODE_EXTENSIONS="py js ts tsx jsx go rs c cc cpp h hpp java kt cs rb php swift sql sh toml yaml yml"

# Files that other code or other teams depend on. When one changes, the
# agent is asked to check the docs, even when no map names the file.
INTERFACE_GLOBS="*.proto *openapi* *schema* *.env.example *.graphql"

# Folder names the kit never looks in.
SKIP_DIRS="node_modules .venv venv vendor target build dist out bin obj"

# --- Extra checks (off when empty) -----------------------------------------
# "yes": a name like `DATABASE_URL` in a map must appear in a code file, so
# a renamed or removed setting is caught.
CHECK_ENV=""

# Maps whose ## Run and ## Check commands CI runs to prove they still work
# (check.sh --run-commands). Only maps with quick commands.
# Example: "AGENTS.md services/api/AGENTS.md"
RUN_COMMANDS_MAPS=""

# --- Decisions, experiments, learning docs ---------------------------------
# The folder with one file per decision (D-001-use-postgres.agentk.md).
# DECISIONS.agentk.md at the root lists them all. Empty: every decision is
# written in DECISIONS.agentk.md itself.
DECISIONS_DIR="docs/decisions"

# The experiment ledger: a table with one row per experiment folder beside
# it. Example: "experiments/EXPERIMENTS.agentk.md". Empty: no experiments.
LEDGER=""

# The folder for learning docs (lessons with quizzes for people).
# Empty turns its checks off.
LEARNING_DIR="learning_docs"

# --- Skills and copies -------------------------------------------------------
# How .claude/skills shows .agents/skills: "symlink" (one copy) or "copy"
# (for Windows without symlinks). The install picks "copy" by itself when a
# symlink fails.
SKILLS_LINK="symlink"

# Kit skills that are now the repo's own. The kit never replaces them, even
# when it has a newer version. Example: "lineage scaffold"
OWN_SKILLS=""
