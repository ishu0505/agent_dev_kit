# agent-kit settings for this repo. Read by .agents/kit/check.sh, the Stop
# hook and the skills. Plain sh: KEY="value", space-separated lists.
# This file belongs to the repo; install.sh --upgrade never overwrites it.

# What goes to the remote repo (set at setup; change with
# install.sh --share <mode>):
#   agent     agent files pushed, learning docs local (default)
#   all       agent files and learning docs pushed
#   learning  learning docs pushed, agent files local
#   none      nothing pushed; everything stays on this machine
# Agent files: every AGENTS.md and pointer file, DECISIONS.md, PLAN.md, the
# ledger, .agents/, .claude/, .codex/, .githooks/. Local files are ignored
# through .git/info/exclude, so not even an ignore rule reaches the remote.
SHARE="agent"

# Folders that are units on their own (each needs README.md + AGENTS.md).
UNITS=""

# Folders whose every child folder is a unit, e.g. "services packages crates".
UNIT_PARENTS=""

# How .claude/skills shows .agents/skills: "symlink" (one copy) or "copy"
# (for repos cloned on Windows without symlink support). The install picks
# "copy" by itself when symlinks fail.
SKILLS_LINK="symlink"

# Skills the repo owns: the kit never replaces them, even if they share a
# name with a kit skill (e.g. "lineage scaffold"). Other kit skills are
# replaced on upgrade only when the repo never edited them.
OWN_SKILLS=""

# Line limits for maps: the root and first-level folders, then units.
TOP_MAP_MAX=70
UNIT_MAP_MAX=40

# Pointer files next to every AGENTS.md, each containing only @AGENTS.md.
# CLAUDE.md for Claude Code; add GEMINI.md for Gemini CLI / Antigravity.
POINTER_FILES="CLAUDE.md"

# File extensions the Stop hook treats as code (no dots).
CODE_EXTENSIONS="py js ts tsx jsx go rs c cc cpp h hpp java kt cs rb php swift sql sh toml yaml yml"

# Experiment ledger; every folder beside it needs a row with an outcome.
# Leave empty when the repo has no experiments.
LEDGER=""

# Local learning docs: git-ignored, never committed. Empty turns the check off.
LEARNING_DIR="learning_docs"

# Folder names never treated as units or maps.
SKIP_DIRS="node_modules .venv venv vendor target build dist out bin obj"
